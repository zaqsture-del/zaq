",desc:"8x7, 6x9, hafalan cepat",icon:"✖️",content:["Perkalian adalah penjumlahan berulang.","Trik 9: jari ditekuk = hasil puluhan & satuan.","Trik 5: hasil = setengah dari x10."],examples:["8×7 = 56 (hafal: 8-5-6 naik)","7×5=35 karena 7×10=70 ÷2"],tips:"Hafal sampai 10x10 bikin SMP jadi mudah."},{id:3,title:"Cerita SD",desc:"Soal cerita belanja & umur",icon:"\uD83D\uDED2",content:["Baca soal pelan, garis bawahi angka.","Tentukan operasi: total= tambah, sisa= kurang.","Tulis kalimat matematika dulu baru hitung."],examples:["Budi beli 12 apel + 15 jeruk = 27 buah","Umur Ayah 35, Budi 9, selisih 26 tahun"],tips:"Jangan buru-buru, cek kembali soalnya."}],smp:[{id:1,title:"Aljabar & Persamaan",desc:"2x+3=11, variabel & koefisien",icon:"\uD83E\uDDEE",content:["Variabel = huruf pengganti angka.","Pindah ruas ganti tanda: + jadi -, × jadi ÷.","Selesaikan satu sisi dulu biar rapi."],examples:["2x+3=11 → 2x=8 → x=4","3x-5=10 → 3x=15 → x=5"],tips:"Cek balik: masukkan x ke persamaan awal."},{id:2,title:"Pecahan & Pythagoras",desc:"Pecahan campuran, a²+b²=c²",icon:"\uD83D\uDCD0",content:["Pecahan: samakan penyebut dulu baru operasi.","Pythagoras cuma untuk segitiga siku-siku.","c = sisi miring, selalu paling panjang."],examples:["1/2+1/3=3/6+2/6=5/6","3-4-5: 3²+4²=9+16=25=5²"],tips:"Gambar segitiga bantu ingat mana a,b,c."},{id:3,title:"Lingkaran SMP",desc:"Keliling & luas lingkaran",icon:"⭕",content:["π = 22/7 jika r kelipatan 7, 3.14 jika bukan.","Keliling K=2πr, Luas L=πr²","Jangan ketuker K dan L!"],examples:["r=7, K=2×22/7×7=44","r=7, L=22/7×49=154"],tips:"r kelipatan 7 → pakai 22/7 biar enak."}],sma:[{id:1,title:"Limit & Turunan",desc:"limit x→0 sinx/x, d/dx xⁿ",icon:"♾️",content:["Limit: dekati nilai, bukan sama persis.","sinx/x →1 saat x→0 (limit penting).","Turunan power rule: d/dx xⁿ = n·xⁿ⁻¹"],examples:["lim x→0 sinx/x =1","d/dx x³ =3x²","d/dx 5x² =10x"],tips:"Turunan itu kemiringan grafik di titik itu."},{id:2,title:"Integral & Trigonometri",desc:"∫2x dx, sin30°, cos60°",icon:"\uD83D\uDCCA",content:["Integral kebalikan turunan + jangan lupa +C.","Sinus: depan/miring, Cos: samping/miring.","Nilai sudut istimewa 0°,30°,45°,60°,90° wajib hafal."],examples:["∫2x dx = x²+C","sin30°=1/2, cos60°=1/2, tan45°=1"],tips:"Buat tabel sudut istimewa di catatan."}]},english:{sd:[{id:1,title:"Greetings & Colors",desc:"Hello, Hi, Red, Blue",icon:"\uD83D\uDC4B",content:["Hello = formal, Hi = casual.","Warna: red merah, blue biru, green hijau.","Sapaan + warna: Hello, my bag is red!"],examples:["Hello! How are you? → I am fine","What color? → It is blue"],tips:"Latih ucapin keras-keras biar pede."},{id:2,title:"Numbers & Animals",desc:"One-ten, Cat Dog Bird",icon:"\uD83D\uDD22",content:["One to ten wajib hafal.","Cat=kucing, Dog=anjing, Bird=burung.","Plural tambah -s: cats, dogs."],examples:["I have two cats","There are five birds"],tips:"Tempel stiker vocab di rumah."}],smp:[{id:1,title:"Tenses SMP",desc:"Simple present, past, continuous",icon:"⏰",content:["Present: I eat, She eats (+s)","Past: I ate yesterday (V2)","Continuous: am/is/are + V-ing untuk sedang"],examples:["She goes to school (he/she/it +s)","I went to market yesterday","He is playing now"],tips:"Kata yesterday/last week = past."},{id:2,title:"Daily Conversation",desc:"Can you help me? etc",icon:"\uD83D\uDCAC",content:["Can you help me? = minta tolong sopan.","Give me terlalu direct, pakai Can I have...","Thank you → You are welcome"],examples:["Can I have some water, please?","I am fine, thank you!"],tips:"Senyum + please bikin lebih sopan."},{id:3,title:"Descriptive Text",desc:"My cat is cute...",icon:"\uD83D\uDCDD",content:["Struktur: Identification + Description.","Pakai adjective: cute, big, fluffy.","Simple present untuk fakta."],examples:["My cat is white. It is fluffy and cute.","Borobudur is big and beautiful."],tips:"Mulai dari 3 kalimat, lalu kembangkan."}],sma:[{id:1,title:"Conditional & TOEFL",desc:"If I were..., although",icon:"\uD83C\uDFAF",content:["Conditional 2: If + past, would + V1 (khayalan).","Although = meskipun (butuh kontras).","TOEFL: subject-verb agreement he/she/it +s"],examples:["If I were rich, I would travel","Although it was raining, we went","He goes (not He go)"],tips:"Were untuk semua subjek di conditional 2."},{id:2,title:"Essay & Debate",desc:"Opinion, argument, formal email",icon:"\uD83D\uDCDA",content:["Essay: Introduction - Body - Conclusion.","Debate: claim + evidence + example.","Formal email: Dear Sir, ... Sincerely,"],examples:["I think... because... for example...","Dear Sir, I am writing to..."],tips:"Pakai linking words: however, therefore, moreover."}]},japan:{sd:[{id:1,title:"Hiragana Dasar",desc:"あ-お, か-こ, さ-そ",icon:"あ",content:["あ a, い i, う u, え e, お o","か ka, き ki, く ku, け ke, こ ko","Tulis urutan goresan biar rapi."],examples:["さくら = sa-ku-ra = sakura","あい = ai = cinta"],tips:"Hafal 5 dulu, baru tambah 5 lagi."},{id:2,title:"Aisatsu & Angka",desc:"Ohayou, Konnichiwa, 1-10",icon:"\uD83D\uDC4B",content:["Ohayou gozaimasu = selamat pagi formal","Konnichiwa = siang, Konbanwa = malam","1 ichi, 2 ni, 3 san, 4 yon, 5 go"],examples:["おはよう！(Ohayou)","ありがとう (Arigatou = makasih)"],tips:"Pakai aisatsu tiap ketemu orang Jepang di anime!"}],smp:[{id:1,title:"Kotoba N5 & ~masu",desc:"100 kata N5, tabemasu, nomimasu",icon:"\uD83D\uDCD6",content:["Kotoba N5: watashi saya, anata kamu, taberu makan","Masu = bentuk sopan: tabemasu, nomimasu","Desu = adalah: gakusei desu = saya murid"],examples:["Watashi wa gakusei desu = Saya adalah murid","Mizu o nomimasu = Minum air"],tips:"Buat flashcard 10 kata per hari."},{id:2,title:"Partikel wa, o, ni",desc:"は wa, を o, に ni",icon:"\uD83D\uDD24",content:["は topik marker dibaca wa, bukan ha","を objek dibaca o","に untuk tempat/waktu: gakkou ni ikimasu"],examples:["Watashi wa ringo o tabemasu = Saya makan apel","7ji ni okimasu = Bangun jam 7"],tips:"Partikel itu kunci grammar Jepang!"}],sma:[{id:1,title:"Kanji N4-N3",desc:"日, 水, 山, 躊躇",icon:"字",content:["日 = matahari/hari (nichi/hi)","水 = air (mizu), 山 = gunung (yama)","N3 mulai 300 kanji, gabungan makna."],examples:["日本 Nihon = Jepang (matahari asal)","水曜日 Suiyoubi = hari Rabu (hari air)"],tips:"Kanji = gambar cerita, bayangkan bentuknya."},{id:2,title:"Bunpou N3 & Keigo",desc:"meshiagaru, yoroshiku",icon:"\uD83C\uDFEF",content:["Keigo: meshiagaru = makan (hormat), itadaku = makan (merendah)","Yoroshiku onegaishimasu = mohon bantuannya / senang berkenalan","Bunpou N3: ~you ni naru, ~koto ga dekiru"],examples:["Meshiagatte kudasai = Silakan makan (sopan)","Nihongo ga hanaseru you ni narimashita = Jadi bisa bahasa Jepang"],tips:"Keigo dipakai ke atasan / orang lebih tua."}]}},$r={math:{sd:[{id:1,title:"Penjumlahan",desc:"15+27, 34+18",icon:"➕",questions:[{q:"15 + 27 = ?",options:["32","42","40","37"],correct:1,whyWrong:"5+7=12 simpan 1, 1+2+1=4 jadi 42 bukan 32.",explanation:"Susun ke bawah: satuan dulu.",steps:["5+7=12 tulis 2 simpan 1","1+2+1=4","Hasil 42"]},{q:"34 + 18 = ?",options:["42","52","50","44"],correct:1,whyWrong:"4+8=12 tulis 2 simpan 1, jadi 52.",explanation:"Teknik simpan.",steps:["4+8=12","3+1+1=5","52"]},{q:"Ibu punya 25 apel, beli lagi 17. Total?",options:["32","40","42","35"],correct:2,whyWrong:"25+17=42, bukan 32.",explanation:"Cerita penjumlahan.",steps:["25+17","5+7=12","42"]}]},{id:2,title:"Perkalian Dasar",desc:"8x7, 6x9, 7x5",icon:"✖️",questions:[{q:"8 × 7 = ?",options:["54","56","49","64"],correct:1,whyWrong:"8×7 itu 56 bukan 54.",explanation:"Hafalan 8×7=56.",steps:["8×7=56","Ingat 7-8-56"]},{q:"6 × 9 = ?",options:["54","56","63","45"],correct:0,whyWrong:"6×9=54.",explanation:"Trik: 6×10=60-6=54.",steps:["6×10=60","60-6=54"]},{q:"7 × 5 = ?",options:["30","35","40","45"],correct:1,whyWrong:"Ganjil ×5 belakangnya 5.",explanation:"7×5=35.",steps:["7×10=70","70/2=35"]}]},{id:3,title:"Pembagian",desc:"56÷7, 81÷9",icon:"➗",questions:[{q:"56 ÷ 7 = ?",options:["6","7","8","9"],correct:2,whyWrong:"7×8=56 jadi 56÷7=8.",explanation:"Kebalikan perkalian.",steps:["7×? =
